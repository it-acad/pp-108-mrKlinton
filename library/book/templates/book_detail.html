{% extends 'base.html' %}

{% block title %}
додаткова інформація
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card">
        <div class="card-header">
            <h1 class="card-title">{{ book.name }}</h1>
        </div>
        <div class="card-body">
            <p class="card-text">{{ book.description }}</p>
            <p class="card-text"><strong>Count:</strong> {{ book.count }}</p>
        </div>
    </div>
</div>
{% endblock %}
