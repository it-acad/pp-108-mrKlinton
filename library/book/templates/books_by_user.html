{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Books for {{ user.first_name }} {{ user.last_name }}</h2>
    <ul class="list-group">
        {% for book in books %}
            <li class="list-group-item">
                <strong>{{ book.name }}</strong> - {{ book.description }}
                <span class="badge bg-primary">Count: {{ book.count }}</span>
            </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
